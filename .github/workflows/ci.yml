name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Browser journeys
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: ignore

  android:
    name: Android test APK
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Build signed test APK
        env:
          MIXLINE_KEYSTORE_BASE64: ${{ secrets.MIXLINE_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew scripts/build-apk.sh
          bash scripts/build-apk.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mixline-APK
          path: |
            artifacts/*.apk
            artifacts/*.sha256
            artifacts/signing-certificate.txt
      - name: Read app version
        id: version
        run: echo "name=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: Mixline ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: Signed Mixline test APK built from ${{ github.sha }}. Android 10 or newer. Verify with the .sha256 file before installing.
          files: |
            artifacts/*.apk
            artifacts/*.sha256
