  <link rel="stylesheet" href="assets/fonts/fonts.css">

  <link rel="stylesheet" href="screens/launch/launch.css">

<body>
  <a class="skip" href="#outlet">Skip to the prototype</a>
  <aside id="switcher" aria-label="Prototype controls"></aside>
  <main class="stagearea">
    <div class="device-wrap">
      <div class="device" id="device">
        <div class="device__status-guide" aria-hidden="true"><span>status bar · 24 dp assumed</span><span>FIXTURE</span></div>
        <div id="outlet" class="device__outlet" aria-live="polite"></div>
        <div class="device__gesture-guide" aria-hidden="true"></div>
      </div>
    </div>
    <div id="walkbar"></div>
  </main>
  <button id="switcher-toggle" class="btn btn--primary" type="button" data-hit="48" aria-controls="switcher" aria-expanded="false">Prototype controls</button>
  <script type="module" src="app/main.js"></script>

</html>
